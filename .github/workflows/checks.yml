name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: watchdog checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Workflow file parses
        run: node -e "JSON.parse(require('fs').readFileSync('workflow/website-and-line-watchdog-sms.json','utf8')); console.log('ok')"

      - name: 63 checks against the Code node source
        working-directory: tests
        run: npm install --no-audit --no-fund && node watchdog.test.js
